# Base URI of the Place API; endpoint paths come from GlobalEnum
api.base.uri = https://rahulshettyacademy.com

# Public demo key for the practice API, sent as the "key" query parameter
api.key = qaclick123

# Cleanup: total tries for one delete (first try + retries); only server errors (5xx) and network errors are retried
cleanup.retry.attempts = 2

# Cleanup: wait before retrying a failed delete, in milliseconds; kept short because cleanup runs after every scenario
cleanup.retry.delay.ms = 1000

# Orphan sweep: only test data older than this is deleted, so a run in progress elsewhere is never touched
sweep.min.age.minutes = 30
